name: Atlas

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/atlas.yaml
      - "migrations/**"
  pull_request:
    paths:
      - .github/workflows/atlas.yaml
      - "migrations/**"

permissions:
  contents: read
  pull-requests: write

env:
  ATLAS_DIR: file://migrations
  ATLAS_DIR_NAME: app
  ATLAS_DEV_URL: sqlite://dev?mode=memory

jobs:
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}
      - uses: ariga/atlas-action/migrate/lint@v1
        with:
          dir: ${{ env.ATLAS_DIR }}
          dir-name: ${{ env.ATLAS_DIR_NAME }}
          dev-url: ${{ env.ATLAS_DEV_URL }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

  push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}
      - uses: ariga/atlas-action/migrate/push@v1
        with:
          dir: ${{ env.ATLAS_DIR }}
          dir-name: ${{ env.ATLAS_DIR_NAME }}
          dev-url: ${{ env.ATLAS_DEV_URL }}
