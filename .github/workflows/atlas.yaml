name: Atlas Lint

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      latest:
        description: Number of latest migration files to lint
        default: "1"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ariga/setup-atlas@v0
        with:
          cloud-token: ${{ secrets.ATLAS_CLOUD_TOKEN }}
      - name: Hash migrations
        run: atlas migrate hash --dir file://migrations
      # Pull requests: lint via the action, which comments the report on the PR.
      - name: Lint migrations (PR)
        if: github.event_name == 'pull_request'
        uses: ariga/atlas-action/migrate/lint@v1
        with:
          dir: file://migrations
          dir-name: app
          dev-url: sqlite://dev?mode=memory
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Push / manual runs: no PR to comment on, so lint with the CLI.
      - name: Lint migrations
        if: github.event_name != 'pull_request'
        run: |
          atlas migrate lint \
            --dir file://migrations \
            --dev-url "sqlite://dev?mode=memory" \
            --latest ${{ inputs.latest || '1' }}
